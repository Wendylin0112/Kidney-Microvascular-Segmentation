name: Generate prediction previews

on:
  workflow_dispatch:
  push:
    paths:
      - "Predicted_images/*.tif"
      - ".github/workflows/prediction-previews.yml"

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    concurrency:
      group: prediction-previews-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Convert existing TIFF predictions to PNG thumbnails
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          target = Path("docs/previews")
          target.mkdir(parents=True, exist_ok=True)
          for case in ("444444444444", "888888888888", "999999999999"):
              for suffix in ("1", "2"):
                  src = Path("Predicted_images") / f"predicted_{case}_{suffix}.tif"
                  if not src.exists():
                      continue
                  with Image.open(src) as im:
                      image = ImageOps.autocontrast(im.convert("L")) if suffix == "1" else im.convert("RGB")
                      image.thumbnail((600, 600))
                      image.save(target / f"predicted_{case}_{suffix}.png", optimize=True)
          PY
      - name: Commit generated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/previews
          if ! git diff --cached --quiet; then
            git commit -m "Generate PNG previews of segmentation predictions"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
